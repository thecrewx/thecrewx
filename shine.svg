<svg xmlns="http://www.w3.org/2000/svg" width="600" height="120" viewBox="0 0 600 120">
  <defs>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a8a8a"/>
      <stop offset="15%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#c0c0c0"/>
      <stop offset="50%" stop-color="#ffd700"/>
      <stop offset="70%" stop-color="#c0c0c0"/>
      <stop offset="85%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#8a8a8a"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0)"/>
      <stop offset="40%" stop-color="rgba(255,255,255,0.9)"/>
      <stop offset="60%" stop-color="rgba(255,255,255,0.9)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="3s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <text x="50%" y="30%" dominant-baseline="middle" text-anchor="middle" font-family="'Fira Code', monospace" font-weight="600" font-size="24" fill="url(#metal)">Bonjour, welcome to github</text>
  <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="'Fira Code', monospace" font-weight="600" font-size="24" fill="url(#metal)">Salut, kevin</text>
  <text x="50%" y="70%" dominant-baseline="middle" text-anchor="middle" font-family="'Fira Code', monospace" font-weight="600" font-size="24" fill="url(#metal)">Bienvenue, Cybersecurity Enthusiast</text>

  <text x="50%" y="30%" dominant-baseline="middle" text-anchor="middle" font-family="'Fira Code', monospace" font-weight="600" font-size="24" fill="url(#shine)">Bonjour, welcome to github</text>
  <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="'Fira Code', monospace" font-weight="600" font-size="24" fill="url(#shine)">Salut, kevin</text>
  <text x="50%" y="70%" dominant-baseline="middle" text-anchor="middle" font-family="'Fira Code', monospace" font-weight="600" font-size="24" fill="url(#shine)">Bienvenue, Cybersecurity Enthusiast</text>
</svg>
